name: Release datasets

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      INTERNACIA_DATASETS_DIR: ${{ github.workspace }}/.release-datasets
      # internacia-python ref whose tests/contract suite must pass before publishing.
      # TEMPORARY: pinned to the py-1.1 branch until it is merged; switch back to main then.
      INTERNACIA_SDK_REF: cursor/py-1-1-contract-download-7afe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check internacia_builder/ scripts/ tests/

      - name: Build final release artifacts
        run: |
          python scripts/builder.py build --output-dir .release-datasets

      - name: Check committed descriptors match the release build
        run: python scripts/check_committed_snapshot.py --fresh .release-datasets

      - name: Run tests against the final release build
        run: pytest tests/ --cov=internacia_builder --cov-report=term-missing

      - name: Run the internacia SDK contract suite against the release build
        run: |
          sdk="$RUNNER_TEMP/internacia-python"
          git clone --depth 1 --branch "$INTERNACIA_SDK_REF" https://github.com/datenoio/internacia-python "$sdk"
          pip install "$sdk"
          cd "$sdk" && INTERNACIA_CONTRACT_DB_PATH="$INTERNACIA_DATASETS_DIR/internacia.duckdb" pytest tests/contract -q

      - name: Validate release content, version, and documentation
        run: |
          python scripts/check_generated_artifacts.py --datasets-dir .release-datasets
          python scripts/check_release_bundle.py .release-datasets --version "$GITHUB_REF_NAME"
          python scripts/generate_data_dictionary.py --check
          python scripts/check_doc_counts.py
          python scripts/check_markdown_links.py
          python scripts/builder.py analyze-quality --output .release-quality
          python scripts/check_quality_report.py .release-quality/full_report.jsonl

      - name: Emit schema migration against the previous release
        run: |
          baseline_ref=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          migration_args=()
          if [ -n "$baseline_ref" ]; then
            migration_args+=(--previous-ref "$baseline_ref")
          fi
          python scripts/generate_schema_migration.py \
            "${migration_args[@]}" \
            --current-datasets .release-datasets \
            --version "${GITHUB_REF_NAME#v}" \
            --output ".release-datasets/migration.${GITHUB_REF_NAME}.json"

      - name: Rewrite SHA256SUMS to cover every release asset
        run: |
          python scripts/write_checksums.py .release-datasets
          python scripts/check_release_bundle.py .release-datasets --version "$GITHUB_REF_NAME"

      - name: Push to Hugging Face (optional)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN not set; skipping Hugging Face upload"
            exit 0
          fi
          pip install huggingface_hub
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ.get("HF_DATASET_REPO") or "datenoio/internacia"
          api.create_repo(repo_id=repo_id, repo_type="dataset", exist_ok=True)
          from internacia_builder.distribution import prepare_huggingface_bundle
          root = Path(".hf-release")
          prepare_huggingface_bundle(Path(".release-datasets"), root)
          tables = ("countries", "intblocks", "blocktypes", "memberships")
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  name = path.relative_to(root).as_posix()
                  api.upload_file(path_or_fileobj=str(path), path_in_repo=name,
                                  repo_id=repo_id, repo_type="dataset")
                  print("uploaded", name)
          # One-time cleanup of the legacy flat layout; missing files are fine.
          for name in (f"{t}.parquet" for t in tables):
              try:
                  api.delete_file(path_in_repo=name, repo_id=repo_id, repo_type="dataset")
                  print("deleted legacy", name)
              except Exception:
                  pass
          print("HF push complete:", repo_id)
          PY

      - name: Create GitHub release with dataset assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: .release-datasets/*

      # internacia-python and internacia-api also poll for new releases daily; the dispatch only
      # makes them react at once. It needs the internacia-bot App installed on both repositories.
      - name: Check bot app secrets for downstream notification
        id: bot
        env:
          CLIENT_ID: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::internacia-bot secrets not set; downstream repositories pick up the release on their daily poll"
          fi

      - name: Mint token for downstream repositories
        id: downstream-token
        if: steps.bot.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: internacia-python,internacia-api
          permission-contents: write

      - name: Notify internacia-python and internacia-api
        if: steps.downstream-token.outputs.token
        env:
          GH_TOKEN: ${{ steps.downstream-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for repo in internacia-python internacia-api; do
            gh api "repos/$OWNER/$repo/dispatches" \
              -f event_type=internacia-db-release \
              -f "client_payload[version]=${GITHUB_REF_NAME#v}" \
              -f "client_payload[tag]=$GITHUB_REF_NAME" \
              || echo "::warning::could not notify $repo; it will pick up the release on its daily poll"
          done
