name: Validate datasets

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - '*.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'llms.zh.txt'
      - 'AGENTS.md'
      - 'AGENTS.zh.md'
      - 'CLAUDE.md'
      - '.kimi/**'
      - '.lingma/**'
      - 'templates/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - 'templates/**'
      - 'scripts/**'
      - 'internacia_builder/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      INTERNACIA_DATASETS_DIR: ${{ github.workspace }}/.ci-datasets
      # internacia-python ref whose tests/contract suite must pass on every build.
      INTERNACIA_SDK_REF: main
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check internacia_builder/ scripts/ tests/

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt

      - name: Build datasets (fresh artifacts for tests)
        run: python scripts/builder.py build --output-dir .ci-datasets

      - name: Check committed descriptors match the fresh build
        run: python scripts/check_committed_snapshot.py --fresh .ci-datasets

      - name: Check the build is reproducible
        run: |
          python scripts/builder.py build --output-dir .ci-datasets-repro > /dev/null
          python scripts/check_reproducible_build.py .ci-datasets .ci-datasets-repro
          rm -rf .ci-datasets-repro

      - name: Run tests against freshly built artifacts
        run: pytest tests/ --cov=internacia_builder --cov-report=term-missing

      - name: Run the internacia SDK contract suite against the fresh build
        if: matrix.python-version == '3.12'
        run: |
          sdk="$RUNNER_TEMP/internacia-python"
          git clone --depth 1 --branch "$INTERNACIA_SDK_REF" https://github.com/datenoio/internacia-python "$sdk"
          pip install "$sdk"
          cd "$sdk" && INTERNACIA_CONTRACT_DB_PATH="$INTERNACIA_DATASETS_DIR/internacia.duckdb" pytest tests/contract -q

      - name: Check data dictionary drift
        run: python scripts/generate_data_dictionary.py --check

      - name: Check documentation record counts
        run: python scripts/check_doc_counts.py

      - name: Validate countries
        run: python scripts/validate_countries.py --report completeness-report.json

      - name: Validate intblocks
        run: python scripts/validate_intblocks.py --report intblocks-report.json

      - name: last_verified KPI (job summary)
        if: matrix.python-version == '3.12'
        run: python scripts/last_verified_report.py --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Check internal Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check final staged artifacts and distribution descriptor
        run: |
          python scripts/check_generated_artifacts.py --datasets-dir .ci-datasets
          python scripts/check_release_bundle.py .ci-datasets

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-py${{ matrix.python-version }}
          path: |
            completeness-report.json
            intblocks-report.json

      - name: Diff manifests against baseline
        run: python scripts/diff_countries_baseline.py --allow-row-count-change

      - name: Analyze data quality
        run: python scripts/builder.py analyze-quality --output dataquality

      - name: Fail on high-priority quality issues
        run: python scripts/check_quality_report.py dataquality/full_report.jsonl

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report-py${{ matrix.python-version }}
          path: |
            dataquality/full_report.txt
            dataquality/full_report.jsonl
