description: Global intergovernmental organization exclusively devoted to promoting the rule of law to advance peace and sustainable
  development. IDLO partners with governments and communities to reform laws and strengthen institutions, aiming to make justice
  systems fairer and more effective. The organization has experience working in more than 90 countries with diverse legal
  systems and holds United Nations Observer Status since 2001.
