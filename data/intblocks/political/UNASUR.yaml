recognition_status: Intergovernmental regional organization established by the UNASUR
  Constitutive Treaty (signed 23 May 2008, in force 11 March 2011); evolved from the
  South American Community of Nations (Cusco Declaration, 8 December 2004); pursued
  trade and economic integration including customs union goals that were never fully
  implemented; headquartered in Quito, Ecuador; largely inactive since 2018 after
  widespread suspensions and withdrawals; Argentina, Brazil and Colombia rejoined
  in 2023; Secretary General post vacant since January 2017
