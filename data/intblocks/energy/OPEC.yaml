notes: The official member-countries page lists 12 current members, including the United Arab Emirates (joined 1967), and does not record a UAE withdrawal. A 2026 exit was announced in the press and is not on that roster. Former members kept with end dates are Qatar (1 January 2019), Indonesia (membership suspended 30 November 2016), Ecuador (1 January 2020) and Angola (1 January 2024). OPEC+ is a separate larger framework formed in late 2016 that coordinates production policy between OPEC members and selected non-OPEC producers such as Russia and Kazakhstan. Canada, Egypt, Norway, and Oman have attended OPEC meetings as observers.
