# Shared fragments for the agent instruction files generated by
# scripts/generate_agent_shims.py. Reference them as {{ name }} in templates/agent-shims/.
guardrails_en: |-
  - Countries are reference data only — do **not** add HDI, GDP, government type, or similar socioeconomic fields.
  - Join intblocks on `includes[].id` (country alpha-2), not `includes[].name`.
  - `borders` uses ISO alpha-3 codes; join on `iso3code`.
  - Never hand-edit `data/datasets/` (generated by `python scripts/builder.py build`).
guardrails_zh: |-
  - **禁止** 给 countries 添加 HDI、GDP、政体等社会经济字段。
  - intblock 成员关联用 `includes[].id`（国家 alpha-2），不用 `includes[].name`。
  - `borders` 为 alpha-3；关联时用 `iso3code`。
  - 不要手改 `data/datasets/`（由 `python scripts/builder.py build` 生成）。
data_access_en: |-
  Query `data/datasets/internacia.duckdb` or the Parquet exports, not the source YAML. They are generated, not committed: run `python scripts/builder.py build` once (or download them from the latest GitHub Release).
data_access_zh: |-
  查询请使用 `data/datasets/internacia.duckdb` 或 Parquet 导出，不要解析源 YAML。导出文件不提交到仓库：先运行一次 `python scripts/builder.py build`（或从最新 GitHub Release 下载）。
validate: |-
  ```bash
  python scripts/validate_countries.py --json
  python scripts/validate_intblocks.py --json
  ```
validate_full: |-
  ```bash
  python scripts/validate_countries.py --json
  python scripts/validate_intblocks.py --json
  python scripts/builder.py build
  python scripts/check_generated_artifacts.py
  pytest tests/
  ruff check internacia_builder/ scripts/ tests/
  python scripts/check_doc_counts.py
  python scripts/check_markdown_links.py
  ```
commit_note_en: |-
  Commit the regenerated `data/datasets/` descriptors (manifests, `contract.json`, `datapackage.json`) with the source changes; binary exports are not committed. CI rebuilds and checks that the descriptors match.
